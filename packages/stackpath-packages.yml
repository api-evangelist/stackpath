source: >-
  npmjs.org registry metadata for the first-party @stackpath npm scope (maintainer
  "stackpath-admin"), plus registry.terraform.io/v1/providers/stackpath/stackpath.
  StackPath's own developer portal, docs host and GitHub organization are all gone
  (developer.stackpath.com / docs.stackpath.com have no DNS; github.com/stackpath
  returns HTTP 404), so the package registries are the only surviving first-party
  distribution surface.
note: >-
  StackPath ceased operations in June 2024 and was dissolved; every package below is
  abandoned. The versions and dates are recorded as structured fields because they are
  the clearest published evidence of that: the newest first-party artifact of any kind
  is the Terraform provider v2.1.0 (2024-06-07), five days before the company announced
  it was winding down, and the client-side libraries stopped in 2021. Every package's
  declared source repository now 404s because the github.com/stackpath organization
  was deleted.
