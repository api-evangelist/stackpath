aid: stackpath
name: StackPath
description: StackPath was an American edge computing platform provider headquartered in Dallas, Texas,
  founded in 2015 by SoftLayer co-founder Lance Crosby. It sold CDN, WAF/WAAP, DNS, SSL, object storage,
  edge compute (containers and VMs), serverless scripting and monitoring as a single edge platform, driven
  by a public REST API at gateway.stackpath.com with OAuth2 client-credentials auth and per-service OpenAPI
  definitions. The company exited the CDN business in 2023 (roughly 100 enterprise CDN contracts went
  to Akamai), sold its web application and API protection assets to Gcore in March 2024, then announced
  in June 2024 that it was ceasing operations and liquidating its remaining assets. All StackPath API,
  developer-portal, control-panel and status hosts have since been withdrawn from DNS and the company
  no longer publishes any machine-readable API contract.
